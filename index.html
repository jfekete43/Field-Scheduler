/* ---------------- the scheduling rules, same as the server ---------------- */

const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const TIME_RE = /^([01]\d|2[0-3]):([0-5]\d)$/;
const mins = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const bad = (msg, extra) => Object.assign(new Error(msg), { status: 400 }, extra || {});

function isRealDate(s) {
  if (typeof s !== 'string' || !DATE_RE.test(s)) return false;
  const [y, m, d] = s.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  return dt.getUTCFullYear() === y && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d;
}
function addDaysISO(s, n) {
  const [y, m, d] = s.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d)); dt.setUTCDate(dt.getUTCDate() + n);
  return dt.toISOString().slice(0, 10);
}
const clean = (v, n) => String(v == null ? '' : v).trim().slice(0, n);

function normalize(p) {
  const fieldId = Number(p.fieldId);
  const field = DB.fields.find((f) => f.id === fieldId);
  if (!field) throw bad('Choose a field.');
  const date = clean(p.eventDate, 10);
  if (!isRealDate(date)) throw bad('Enter a valid date.');
  const allDay = p.allDay === true || p.allDay === 'true';
  const st = allDay ? '00:00' : clean(p.startTime, 5);
  const en = allDay ? '23:59' : clean(p.endTime, 5);
  if (!allDay) {
    if (!TIME_RE.test(st)) throw bad('Enter a valid start time.');
    if (!TIME_RE.test(en)) throw bad('Enter a valid end time.');
    if (mins(en) <= mins(st)) throw bad('The end time must be after the start time.');
  }
  const type = clean(p.eventType, 20) || 'game';
  if (!EVENT_TYPES.some((t) => t.value === type)) throw bad('Choose a valid event type.');
  const status = clean(p.status, 20) || 'scheduled';
  if (!STATUSES.some((s) => s.value === status)) throw bad('Choose a valid status.');
  return {
    field_id: fieldId, event_type: type, title: clean(p.title, 120), division: clean(p.division, 60),
    home_team: clean(p.homeTeam, 80), away_team: clean(p.awayTeam, 80),
    event_date: date, start_time: st, end_time: en, all_day: allDay ? 1 : 0,
    notes: clean(p.notes, 1000), status,
  };
}

function conflictsFor(ev, excludeId) {
  return DB.events.filter((e) =>
    e.field_id === ev.field_id && e.event_date === ev.event_date &&
    e.status !== 'canceled' && e.status !== 'rain' && e.id !== excludeId &&
    mins(e.start_time) < mins(ev.end_time) && mins(e.end_time) > mins(ev.start_time)
  ).map(describe);
}
function describe(e) {
  const f = DB.fields.find((x) => x.id === e.field_id);
  const l = DB.locations.find((x) => x.id === f.location_id);
  const who = [e.home_team, e.away_team].filter(Boolean).join(' vs ');
  return { id: e.id, label: e.title || who || e.division || e.event_type,
    locationName: l.name, fieldName: f.name, date: e.event_date,
    startTime: e.start_time, endTime: e.end_time, allDay: !!e.all_day };
}
function shape(e) {
  const f = DB.fields.find((x) => x.id === e.field_id);
  const l = DB.locations.find((x) => x.id === f.location_id);
  return {
    id: e.id, eventType: e.event_type, title: e.title, division: e.division,
    homeTeam: e.home_team, awayTeam: e.away_team, date: e.event_date,
    startTime: e.start_time, endTime: e.end_time, allDay: !!e.all_day,
    notes: e.notes, status: e.status,
    seriesId: e.series_id, fieldId: f.id, fieldName: f.name, fieldSlug: f.slug, fieldKind: f.kind,
    locationId: l.id, locationName: l.name, locationSlug: l.slug,
    locationAddress: l.address, locationMapsQuery: l.maps_query, updatedAt: e.updated_at,
  };
}

function locationsPayload(includeInactive) {
  return DB.locations.slice().sort((a, b) => a.sort_order - b.sort_order).map((l) => ({
    id: l.id, slug: l.slug, name: l.name, address: l.address,
    mapsQuery: l.maps_query || l.address || l.name, latitude: l.latitude, longitude: l.longitude,
    notes: l.notes, mapImage: l.map_image, sortOrder: l.sort_order,
    fields: DB.fields.filter((f) => f.location_id === l.id && (includeInactive || f.active))
      .sort((a, b) => a.sort_order - b.sort_order)
      .map((f) => ({ id: f.id, slug: f.slug, name: f.name, kind: f.kind, notes: f.notes, sortOrder: f.sort_order, active: !!f.active })),
    pins: DB.pins.filter((p) => p.location_id === l.id)
      .map((p) => ({ id: p.id, fieldId: p.field_id, label: p.label, x: p.x_pct, y: p.y_pct, color: p.color })),
  }));
}

function listEvents(q, includeInactive) {
  let out = DB.events.slice();
  if (q.from) { if (!isRealDate(q.from)) throw bad('The "from" date is not a valid date.'); out = out.filter((e) => e.event_date >= q.from); }
  if (q.to) { if (!isRealDate(q.to)) throw bad('The "to" date is not a valid date.'); out = out.filter((e) => e.event_date <= q.to); }
  if (!includeInactive) out = out.filter((e) => (DB.fields.find((f) => f.id === e.field_id) || {}).active);
  if (q.location) out = out.filter((e) => (DB.fields.find((f) => f.id === e.field_id) || {}).location_id === Number(q.location));
  if (q.field) out = out.filter((e) => e.field_id === Number(q.field));
  if (q.type) out = out.filter((e) => e.event_type === q.type);
  if (q.division) out = out.filter((e) => (e.division || '').toLowerCase() === String(q.division).toLowerCase());
  if (q.q) {
    const needle = String(q.q).toLowerCase();
    out = out.filter((e) => [e.title, e.home_team, e.away_team, e.division, e.notes]
      .some((v) => String(v || '').toLowerCase().includes(needle)));
  }
  return out.sort((a, b) =>
    a.event_date.localeCompare(b.event_date) || a.start_time.localeCompare(b.start_time) || a.field_id - b.field_id
  ).map(shape);
}

function logDemo(action, detail) {
  DB.audit.unshift({ id: Date.now(), username: SESSION.user ? SESSION.user.username : 'jim',
    action, entity: '', entity_id: '', detail: detail || '',
    created_at: new Date().toISOString().slice(0, 19).replace('T', ' ') });
}

const SESSION = { user: { id: 1, username: 'jim', displayName: 'Jim Fekete', role: 'owner', mustChange: false } };

/* ---------------- the router ---------------- */

function route(method, url, body) {
  const [pathname, search] = url.split('?');
  const q = Object.fromEntries(new URLSearchParams(search || ''));
  const seg = pathname.split('/').filter(Boolean);
  const b = body || {};

  if (method === 'GET' && pathname === '/api/bootstrap') {
    const s = DB.settings;
    return {
      settings: { leagueName: s.league_name, leagueShort: s.league_short, timezone: s.timezone,
        logoPath: s.logo_path, announcement: s.announcement, announcementLevel: s.announcement_level,
        contactEmail: s.contact_email, seasonLabel: s.season_label },
      locations: locationsPayload(!!SESSION.user),
      eventTypes: EVENT_TYPES, statuses: STATUSES, fieldKinds: FIELD_KINDS,
      divisions: [...new Set(DB.events.map((e) => e.division).filter(Boolean))].sort(),
      teams: [...new Set(DB.events.flatMap((e) => [e.home_team, e.away_team]).filter(Boolean))].sort(),
      today: iso(new Date()), signedIn: !!SESSION.user,
    };
  }

  if (method === 'GET' && pathname === '/api/events') {
    const events = listEvents(q, !!SESSION.user);
    return { events, count: events.length };
  }

  if (method === 'GET' && pathname === '/api/auth/me') {
    return { signedIn: !!SESSION.user, user: SESSION.user, csrfToken: 'demo-token', needsSetup: false };
  }
  if (method === 'POST' && pathname === '/api/auth/logout') { return { ok: true }; }
  if (method === 'POST' && pathname === '/api/auth/password') {
    if (String(b.newPassword || '').length < 10) throw bad('Password must be at least 10 characters.');
    logDemo('change_own_password', ''); return { ok: true };
  }

  // ---- events
  if (method === 'POST' && pathname === '/api/admin/events') {
    const every = Number(b.repeatEveryDays || 7);
    const base = normalize(b);
    let repeat = Number(b.repeatCount || 1);
    if (b.repeatUntil) {
      if (!isRealDate(b.repeatUntil)) throw bad('Enter a valid date to repeat until.');
      if (b.repeatUntil < base.event_date) throw bad('The repeat-until date is before the first date.');
      repeat = 0;
      for (let d = base.event_date; d <= b.repeatUntil; d = addDaysISO(d, every)) {
        repeat += 1;
        if (repeat > 60) throw bad('That would create more than 60 events. Choose an earlier end date, or repeat less often.');
      }
    }
    if (repeat > 1) {
      if (!Number.isInteger(repeat) || repeat < 1 || repeat > 60) throw bad('Repeat count must be between 1 and 60.');
      const sid = 'series-' + DB.nextId.event;
      const created = []; const skipped = [];
      for (let i = 0; i < repeat; i += 1) {
        const occ = Object.assign({}, base, { event_date: addDaysISO(base.event_date, i * every) });
        const c = conflictsFor(occ, null);
        if (c.length && !b.allowConflict) { skipped.push({ date: occ.event_date, conflicts: c }); continue; }
        const row = Object.assign({ id: DB.nextId.event++, series_id: sid, updated_at: '' }, occ);
        DB.events.push(row); created.push(shape(row));
      }
      if (!created.length) throw Object.assign(new Error('Every date in that series is already booked.'), { status: 409, conflicts: skipped.flatMap((s) => s.conflicts) });
      logDemo('create_series', `${created.length} events, ${skipped.length} skipped`);
      return { events: created, skipped, seriesId: sid };
    }
    const c = conflictsFor(base, null);
    if (c.length && !b.allowConflict) throw Object.assign(new Error('That field is already booked for part of this time.'), { status: 409, conflicts: c });
    const row = Object.assign({ id: DB.nextId.event++, series_id: null, updated_at: '' }, base);
    DB.events.push(row); logDemo('create_event', describe(row).label);
    return { event: shape(row) };
  }

  if (method === 'PUT' && seg[1] === 'admin' && seg[2] === 'events') {
    const id = Number(seg[3]);
    const idx = DB.events.findIndex((e) => e.id === id);
    if (idx < 0) throw Object.assign(new Error('That event no longer exists.'), { status: 404 });
    const next = normalize(b);
    const c = conflictsFor(next, id);
    if (c.length && !b.allowConflict) throw Object.assign(new Error('That field is already booked for part of this time.'), { status: 409, conflicts: c });
    DB.events[idx] = Object.assign({}, DB.events[idx], next);
    logDemo('update_event', describe(DB.events[idx]).label);
    return { event: shape(DB.events[idx]) };
  }

  if (method === 'DELETE' && seg[1] === 'admin' && seg[2] === 'events') {
    const id = Number(seg[3]);
    const idx = DB.events.findIndex((e) => e.id === id);
    if (idx < 0) throw Object.assign(new Error('That event no longer exists.'), { status: 404 });
    const [gone] = DB.events.splice(idx, 1);
    logDemo('delete_event', describe(gone).label);
    return { ok: true, event: shape(gone) };
  }

  if (method === 'DELETE' && seg[1] === 'admin' && seg[2] === 'series') {
    const sid = decodeURIComponent(seg[3]);
    if (q.from !== undefined && !isRealDate(q.from)) throw bad('That is not a valid date to delete from.');
    const before = DB.events.length;
    DB.events = DB.events.filter((e) => !(e.series_id === sid && (!q.from || e.event_date >= q.from)));
    const removed = before - DB.events.length;
    logDemo('delete_series', `removed ${removed}`);
    return { ok: true, removed };
  }

  if (method === 'POST' && pathname === '/api/admin/events/bulk-status') {
    if (!isRealDate(b.date)) throw bad('Enter a valid date.');
    if (!STATUSES.some((s) => s.value === b.status)) throw bad('Choose a valid status.');
    let ids = null;
    if (b.fieldIds !== undefined) {
      if (!Array.isArray(b.fieldIds)) throw bad('Choose which fields are affected.');
      ids = [...new Set(b.fieldIds.map(Number))].filter((n) => Number.isInteger(n) && n > 0);
      if (!ids.length) throw bad('Pick at least one field.');
    } else if (b.locationId) {
      ids = DB.fields.filter((f) => f.location_id === Number(b.locationId)).map((f) => f.id);
    }
    let n = 0;
    DB.events.forEach((e) => {
      if (e.event_date !== b.date) return;
      if (ids && !ids.includes(e.field_id)) return;
      e.status = b.status; n += 1;
    });
    logDemo('bulk_status', `${b.status} x${n}${ids ? ` fields=${ids.length}` : ' (all fields)'}`);
    return { ok: true, updated: n };
  }

  // ---- locations & fields
  if (method === 'POST' && pathname === '/api/admin/locations') {
    const name = clean(b.name, 80);
    if (!name) throw bad('Enter a location name.');
    DB.locations.push({ id: DB.nextId.location++, slug: name.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
      name, address: '', maps_query: name, latitude: null, longitude: null, notes: '', map_image: null,
      sort_order: DB.locations.length + 1 });
    logDemo('create_location', name);
    return { locations: locationsPayload(true) };
  }
  if (method === 'PUT' && seg[1] === 'admin' && seg[2] === 'locations' && seg.length === 4) {
    const loc = DB.locations.find((l) => l.id === Number(seg[3]));
    if (!loc) throw Object.assign(new Error('That location no longer exists.'), { status: 404 });
    const name = clean(b.name == null ? loc.name : b.name, 80);
    if (!name) throw bad('Enter a location name.');
    const num = (v) => (v === '' || v == null ? null : Number(v));
    const lat = num(b.latitude); const lng = num(b.longitude);
    if (lat != null && (!Number.isFinite(lat) || lat < -90 || lat > 90)) throw bad('Latitude must be between -90 and 90.');
    if (lng != null && (!Number.isFinite(lng) || lng < -180 || lng > 180)) throw bad('Longitude must be between -180 and 180.');
    Object.assign(loc, { name, address: clean(b.address, 240), maps_query: clean(b.mapsQuery, 240),
      notes: clean(b.notes, 500), latitude: lat, longitude: lng });
    logDemo('update_location', name);
    return { locations: locationsPayload(true) };
  }
  if (method === 'DELETE' && seg[1] === 'admin' && seg[2] === 'locations' && seg.length === 4) {
    const id = Number(seg[3]);
    const loc = DB.locations.find((l) => l.id === id);
    const fieldIds = DB.fields.filter((f) => f.location_id === id).map((f) => f.id);
    const count = DB.events.filter((e) => fieldIds.includes(e.field_id)).length;
    if (count && !q.force) throw Object.assign(new Error(`${loc.name} still has ${count} scheduled event(s). Remove them first, or confirm deletion.`), { status: 409, eventCount: count });
    DB.events = DB.events.filter((e) => !fieldIds.includes(e.field_id));
    DB.fields = DB.fields.filter((f) => f.location_id !== id);
    DB.pins = DB.pins.filter((p) => p.location_id !== id);
    DB.locations = DB.locations.filter((l) => l.id !== id);
    logDemo('delete_location', loc.name);
    return { ok: true, locations: locationsPayload(true) };
  }
  if (method === 'PUT' && seg[2] === 'locations' && seg[4] === 'pins') {
    const id = Number(seg[3]);
    if (!Array.isArray(b.pins)) throw bad('No map labels were submitted.');
    if (b.pins.length > 60) throw bad('A map can hold at most 60 labels.');
    const valid = new Set(DB.fields.filter((f) => f.location_id === id).map((f) => f.id));
    const next = b.pins.map((p) => {
      if (!p || typeof p !== 'object') throw bad('That map label is not in a readable form.');
      const label = clean(p.label, 60);
      if (!label) throw bad('Every map label needs text.');
      const x = Number(p.x); const y = Number(p.y);
      if (!Number.isFinite(x) || x < 0 || x > 100 || !Number.isFinite(y) || y < 0 || y > 100) throw bad('Map labels must sit inside the image.');
      const fid = Number(p.fieldId);
      return { id: DB.nextId.pin++, location_id: id, field_id: valid.has(fid) ? fid : null,
        label, x_pct: x, y_pct: y, color: /^#[0-9a-fA-F]{6}$/.test(String(p.color || '')) ? p.color : '#1d4ed8' };
    });
    DB.pins = DB.pins.filter((p) => p.location_id !== id).concat(next);
    logDemo('update_field_map_pins', `${next.length} labels`);
    return { locations: locationsPayload(true) };
  }
  if (method === 'DELETE' && seg[2] === 'locations' && seg[4] === 'map') {
    const id = Number(seg[3]);
    const loc = DB.locations.find((l) => l.id === id);
    loc.map_image = null; DB.pins = DB.pins.filter((p) => p.location_id !== id);
    logDemo('remove_field_map', loc.name);
    return { ok: true, locations: locationsPayload(true) };
  }
  if (method === 'POST' && seg[2] === 'locations' && seg[4] === 'map') {
    const id = Number(seg[3]);
    const loc = DB.locations.find((l) => l.id === id);
    loc.map_image = b.__dataUrl || null;
    logDemo('upload_field_map', loc.name);
    return { mapImage: loc.map_image, locations: locationsPayload(true) };
  }

  if (method === 'POST' && pathname === '/api/admin/fields') {
    const name = clean(b.name, 80);
    if (!name) throw bad('Enter a field name.');
    const locId = Number(b.locationId);
    DB.fields.push({ id: DB.nextId.field++, location_id: locId,
      slug: name.toLowerCase().replace(/[^a-z0-9]+/g, '-'), name,
      kind: FIELD_KINDS.some((k) => k.value === b.kind) ? b.kind : 'baseball', notes: '',
      sort_order: DB.fields.filter((f) => f.location_id === locId).length + 1, active: 1 });
    logDemo('create_field', name);
    return { locations: locationsPayload(true) };
  }
  if (method === 'PUT' && seg[2] === 'fields') {
    const f = DB.fields.find((x) => x.id === Number(seg[3]));
    if (!f) throw Object.assign(new Error('That field no longer exists.'), { status: 404 });
    const name = clean(b.name == null ? f.name : b.name, 80);
    if (!name) throw bad('Enter a field name.');
    f.name = name;
    if (FIELD_KINDS.some((k) => k.value === b.kind)) f.kind = b.kind;
    if (b.sortOrder !== undefined && String(b.sortOrder).trim() !== '' && Number.isInteger(Number(b.sortOrder))) f.sort_order = Number(b.sortOrder);
    if (b.active !== undefined) f.active = b.active ? 1 : 0;
    logDemo('update_field', name);
    return { locations: locationsPayload(true) };
  }
  if (method === 'DELETE' && seg[2] === 'fields') {
    const id = Number(seg[3]);
    const f = DB.fields.find((x) => x.id === id);
    const count = DB.events.filter((e) => e.field_id === id).length;
    if (count && !q.force) throw Object.assign(new Error(`${f.name} still has ${count} scheduled event(s). Mark it inactive to hide it, or confirm deletion.`), { status: 409, eventCount: count });
    DB.events = DB.events.filter((e) => e.field_id !== id);
    DB.fields = DB.fields.filter((x) => x.id !== id);
    logDemo('delete_field', f.name);
    return { ok: true, locations: locationsPayload(true) };
  }

  // ---- settings, logo
  if (method === 'PUT' && pathname === '/api/admin/settings') {
    const map = { leagueName: 'league_name', leagueShort: 'league_short', timezone: 'timezone',
      announcement: 'announcement', announcementLevel: 'announcement_level',
      contactEmail: 'contact_email', seasonLabel: 'season_label' };
    Object.entries(map).forEach(([k, dbk]) => {
      if (b[k] === undefined) return;
      if (dbk === 'timezone') { try { new Intl.DateTimeFormat('en-US', { timeZone: String(b[k]) }); } catch (e) { throw bad(`"${b[k]}" is not a valid timezone name.`); } }
      DB.settings[dbk] = String(b[k]).slice(0, 500);
    });
    logDemo('update_settings', Object.keys(b).join(','));
    return { settings: DB.settings };
  }
  if (method === 'POST' && pathname === '/api/admin/logo') { DB.settings.logo_path = b.__dataUrl || ''; logDemo('upload_logo', ''); return { logoPath: DB.settings.logo_path }; }
  if (method === 'DELETE' && pathname === '/api/admin/logo') { DB.settings.logo_path = ''; logDemo('remove_logo', ''); return { ok: true, logoPath: '' }; }

  // ---- users
  if (method === 'GET' && pathname === '/api/admin/users') {
    return { users: DB.users.map((u) => ({ id: u.id, username: u.username, displayName: u.display_name,
      role: u.role, active: !!u.active, createdAt: u.created_at, lastLoginAt: u.last_login_at })) };
  }
  if (method === 'POST' && pathname === '/api/admin/users') {
    if (SESSION.user.role !== 'owner') throw Object.assign(new Error('Only an owner can manage admin accounts.'), { status: 403 });
    const username = clean(b.username, 40);
    if (!/^[A-Za-z0-9._-]{3,40}$/.test(username)) throw bad('Username must be 3-40 characters: letters, numbers, . _ - only.');
    if (String(b.password || '').length < 10) throw bad('Password must be at least 10 characters.');
    if (!/[0-9]/.test(String(b.password))) throw bad('Password must include at least one number.');
    if (DB.users.some((u) => u.username.toLowerCase() === username.toLowerCase())) throw Object.assign(new Error('That username is already taken.'), { status: 409 });
    const u = { id: DB.nextId.user++, username, display_name: clean(b.displayName, 80) || username,
      role: b.role === 'owner' ? 'owner' : 'admin', active: 1,
      created_at: new Date().toISOString().slice(0, 19).replace('T', ' '), last_login_at: null };
    DB.users.push(u); logDemo('create_user', username);
    return { user: { id: u.id, username: u.username, displayName: u.display_name, role: u.role } };
  }
  if (seg[2] === 'users' && seg[4] === 'password') {
    if (SESSION.user.role !== 'owner') throw Object.assign(new Error('Only an owner can manage admin accounts.'), { status: 403 });
    if (String(b.password || '').length < 10) throw bad('Password must be at least 10 characters.');
    logDemo('reset_password', ''); return { ok: true };
  }
  if (method === 'PUT' && seg[2] === 'users') {
    if (SESSION.user.role !== 'owner') throw Object.assign(new Error('Only an owner can manage admin accounts.'), { status: 403 });
    const u = DB.users.find((x) => x.id === Number(seg[3]));
    if (!u) throw Object.assign(new Error('That admin no longer exists.'), { status: 404 });
    const nextActive = b.active === undefined ? u.active : (b.active ? 1 : 0);
    if (!nextActive && u.id === SESSION.user.id) throw bad('You cannot deactivate your own account.');
    if (!nextActive && u.active && DB.users.filter((x) => x.active).length <= 1) throw bad('At least one active admin must remain.');
    u.active = nextActive;
    if (b.displayName !== undefined) u.display_name = clean(b.displayName, 80);
    if (b.role === 'owner' || b.role === 'admin') u.role = b.role;
    logDemo('update_user', u.username);
    return { user: { id: u.id, username: u.username, displayName: u.display_name, role: u.role } };
  }
  if (method === 'DELETE' && seg[2] === 'users') {
    if (SESSION.user.role !== 'owner') throw Object.assign(new Error('Only an owner can manage admin accounts.'), { status: 403 });
    const u = DB.users.find((x) => x.id === Number(seg[3]));
    if (!u) throw Object.assign(new Error('That admin no longer exists.'), { status: 404 });
    if (u.id === SESSION.user.id) throw bad('You cannot delete your own account.');
    if (u.active && DB.users.filter((x) => x.active).length <= 1) throw bad('At least one active admin must remain.');
    if (u.role === 'owner' && DB.users.filter((x) => x.active && x.role === 'owner').length <= 1) throw bad('At least one owner must remain.');
    DB.users = DB.users.filter((x) => x.id !== u.id); logDemo('delete_user', u.username);
    return { ok: true };
  }

  if (method === 'GET' && pathname === '/api/admin/audit') {
    return { entries: DB.audit.slice(0, Number(q.limit) || 100).map((a) => ({
      id: a.id, username: a.username, action: a.action, entity: a.entity,
      entityId: a.entity_id, detail: a.detail, createdAt: a.created_at })) };
  }

  throw Object.assign(new Error('Not found.'), { status: 404 });
}

/* Replaces the network layer in common.js. Same contract, same errors. */
api.request = function demoRequest(method, url, body) {
  return new Promise((resolve, reject) => {
    const run = () => {
      try {
        let payload = body;
        if (body instanceof FormData) {
          const file = body.get('image');
          if (file && file.size) {
            const reader = new FileReader();
            reader.onload = () => {
              try { resolve(route(method, url, { __dataUrl: reader.result })); }
              catch (err) { reject(err); }
            };
            reader.onerror = () => reject(new Error('That image could not be read.'));
            reader.readAsDataURL(file);
            return;
          }
          payload = {};
        }
        resolve(route(method, url, payload));
      } catch (err) { reject(err); }
    };
    setTimeout(run, 60); // a touch of latency, so loading states are real
  });
};

function mountPublic() {
/* Public schedule view. */
'use strict';

const state = {
  // Fields is the landing view: on a day with anything on it, seeing which
  // field is busy and where the gaps are answers more questions than a list.
  view: 'timeline',
  anchor: null,          // YYYY-MM-DD
  today: null,
  filters: { location: '', field: '', type: '', division: '', q: '' },
  boot: null,
  events: [],
  loading: false,
  requestId: 0,
};

const UPCOMING_DAYS = 60;

/* ---------------- Bootstrapping ---------------- */

async function init() {
  wireModals();

  try {
    const boot = await api.get('/api/bootstrap');
    state.boot = boot;
    state.today = boot.today;
    setBranding(boot.settings);
    renderAnnouncement(boot.settings);
    populateFilterOptions();
    renderLocations();
    applyStateFromUrl();
    // Wired only once the data is in: clicking a view or filter before then
    // would run against a null state.boot.
    wireControls();
    await loadEvents();
  } catch (err) {
    $('#schedule-root').replaceChildren(
      h('div', { class: 'empty' },
        h('div', { class: 'empty-icon' }, '⚠'),
        h('h3', {}, 'The schedule could not be loaded'),
        h('p', {}, err.message))
    );
  }
}

function wireControls() {
  $$('.segmented [data-view]').forEach((btn) => {
    btn.addEventListener('click', () => setView(btn.dataset.view));
  });

  $('#btn-prev').addEventListener('click', () => shift(-1));
  $('#btn-next').addEventListener('click', () => shift(1));
  $('#btn-today').addEventListener('click', () => {
    state.anchor = state.today;
    syncUrl();
    loadEvents();
  });

  $('#btn-print').addEventListener('click', () => window.print());

  // On a phone the filters fold away so the view switcher can stay pinned.
  $('.toolbar').classList.add('filters-collapsed');
  $('#btn-filters').addEventListener('click', () => {
    const toolbar = $('.toolbar');
    const open = toolbar.classList.toggle('filters-collapsed') === false;
    $('#btn-filters').setAttribute('aria-expanded', String(open));
  });
  $('#btn-subscribe').addEventListener('click', openSubscribe);

  const onFilterChange = () => {
    state.filters.location = $('#f-location').value;
    state.filters.field = $('#f-field').value;
    state.filters.type = $('#f-type').value;
    state.filters.division = $('#f-division').value;
    rebuildFieldOptions();
    syncUrl();
    loadEvents();
  };

  $('#f-location').addEventListener('change', () => {
    // Changing location invalidates a field chosen at another site.
    state.filters.field = '';
    $('#f-field').value = '';
    onFilterChange();
  });
  ['#f-field', '#f-type', '#f-division'].forEach((sel) =>
    $(sel).addEventListener('change', onFilterChange)
  );

  $('#f-search').addEventListener('input', debounce(() => {
    state.filters.q = $('#f-search').value.trim();
    syncUrl();
    loadEvents();
  }, 300));

  $('#btn-clear').addEventListener('click', () => {
    state.filters = { location: '', field: '', type: '', division: '', q: '' };
    $('#f-location').value = '';
    $('#f-type').value = '';
    $('#f-division').value = '';
    $('#f-search').value = '';
    rebuildFieldOptions();
    syncUrl();
    loadEvents();
  });

  window.addEventListener('popstate', () => {
    applyStateFromUrl();
    loadEvents();
  });
}

function populateFilterOptions() {
  const { locations, eventTypes, divisions } = state.boot;

  const locSelect = $('#f-location');
  const subLoc = $('#sub-location');
  for (const select of [locSelect, subLoc]) {
    clear(select).append(h('option', { value: '' }, 'All locations'));
    locations.forEach((loc) => select.append(h('option', { value: String(loc.id) }, loc.name)));
  }

  const typeSelect = $('#f-type');
  clear(typeSelect).append(h('option', { value: '' }, 'All types'));
  eventTypes.forEach((type) => typeSelect.append(h('option', { value: type.value }, type.label)));

  const divSelect = $('#f-division');
  const subDiv = $('#sub-division');
  for (const select of [divSelect, subDiv]) {
    clear(select).append(h('option', { value: '' }, 'All divisions'));
    divisions.forEach((div) => select.append(h('option', { value: div }, div)));
  }

  rebuildFieldOptions();
}

function rebuildFieldOptions() {
  const { locations } = state.boot;
  const build = (select, locationId, keep) => {
    const chosen = keep ? select.value : '';
    clear(select).append(h('option', { value: '' }, 'All fields'));
    const pool = locationId
      ? locations.filter((loc) => String(loc.id) === String(locationId))
      : locations;
    pool.forEach((loc) => {
      const group = h('optgroup', { label: loc.name });
      loc.fields.forEach((field) =>
        group.append(h('option', { value: String(field.id) }, field.name))
      );
      if (loc.fields.length) select.append(group);
    });
    if (chosen && select.querySelector(`option[value="${chosen}"]`)) select.value = chosen;
  };

  build($('#f-field'), state.filters.location, true);
  $('#f-field').value = state.filters.field || '';
  build($('#sub-field'), $('#sub-location')?.value, true);
}

/* ---------------- URL state ---------------- */

function applyStateFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const view = params.get('view');
  state.view = ['day', 'timeline', 'week', 'upcoming'].includes(view) ? view : 'timeline';

  const date = params.get('date');
  state.anchor = /^\d{4}-\d{2}-\d{2}$/.test(date || '') ? date : state.today;

  // Ids from the URL are checked against the real data. An id that no longer
  // exists would otherwise stay in state and filter the schedule while the
  // controls still read "All locations".
  const knownLocation = (id) => state.boot.locations.some((l) => String(l.id) === id);
  const knownField = (id) => state.boot.locations.some((l) => l.fields.some((f) => String(f.id) === id));
  const knownType = (value) => state.boot.eventTypes.some((t) => t.value === value);
  const knownDivision = (value) => state.boot.divisions.includes(value);

  const rawLocation = params.get('location') || '';
  const rawField = params.get('field') || '';
  const rawType = params.get('type') || '';
  const rawDivision = params.get('division') || '';

  state.filters = {
    location: knownLocation(rawLocation) ? rawLocation : '',
    field: knownField(rawField) ? rawField : '',
    type: knownType(rawType) ? rawType : '',
    division: knownDivision(rawDivision) ? rawDivision : '',
    q: params.get('q') || '',
  };

  $('#f-location').value = state.filters.location;
  $('#f-type').value = state.filters.type;
  $('#f-division').value = state.filters.division;
  $('#f-search').value = state.filters.q;
  rebuildFieldOptions();

  $$('.segmented [data-view]').forEach((btn) =>
    btn.setAttribute('aria-pressed', String(btn.dataset.view === state.view))
  );
  $('#date-nav').hidden = state.view === 'upcoming';
}

function syncUrl() {
  const params = new URLSearchParams();
  if (state.view !== 'timeline') params.set('view', state.view);
  if (state.view !== 'upcoming' && state.anchor !== state.today) params.set('date', state.anchor);
  for (const [key, value] of Object.entries(state.filters)) {
    if (value) params.set(key, value);
  }
  const query = params.toString();
  try { window.history.replaceState(null, '', query ? `/?${query}` : '/'); } catch { /* file:// */ }
}

function setView(view) {
  if (state.view === view) return;
  state.view = view;
  $$('.segmented [data-view]').forEach((btn) =>
    btn.setAttribute('aria-pressed', String(btn.dataset.view === view))
  );
  $('#date-nav').hidden = view === 'upcoming';
  syncUrl();
  loadEvents();
}

function shift(direction) {
  const step = state.view === 'week' ? 7 : 1;
  state.anchor = addDays(state.anchor, direction * step);
  syncUrl();
  loadEvents();
}

/* ---------------- Fetching ---------------- */

function currentRange() {
  if (state.view === 'day' || state.view === 'timeline') {
    return { from: state.anchor, to: state.anchor };
  }
  if (state.view === 'week') {
    const from = startOfWeek(state.anchor);
    return { from, to: addDays(from, 6) };
  }
  return { from: state.today, to: addDays(state.today, UPCOMING_DAYS) };
}

async function loadEvents() {
  const range = currentRange();
  const params = new URLSearchParams({ from: range.from, to: range.to });
  if (state.filters.location) params.set('location', state.filters.location);
  if (state.filters.field) params.set('field', state.filters.field);
  if (state.filters.type) params.set('type', state.filters.type);
  if (state.filters.division) params.set('division', state.filters.division);
  if (state.filters.q) params.set('q', state.filters.q);

  updateDateLabel(range);
  renderChips();

  const requestId = ++state.requestId;
  state.loading = true;

  try {
    const data = await api.get(`/api/events?${params}`);
    if (requestId !== state.requestId) return; // a newer request already answered
    state.events = data.events;
    render();
  } catch (err) {
    if (requestId !== state.requestId) return;
    $('#schedule-root').replaceChildren(
      h('div', { class: 'empty' },
        h('div', { class: 'empty-icon' }, '⚠'),
        h('h3', {}, 'Could not load the schedule'),
        h('p', {}, err.message))
    );
  } finally {
    if (requestId === state.requestId) state.loading = false;
  }
}

function updateDateLabel(range) {
  const label = $('#date-label');
  if (state.view === 'day' || state.view === 'timeline') label.textContent = formatDateLong(range.from);
  else if (state.view === 'week') label.textContent = formatRangeLabel(range.from, range.to);
  else label.textContent = '';

  const title = $('#schedule-title');
  title.textContent =
    state.view === 'upcoming' ? `Next ${UPCOMING_DAYS} Days` :
    state.view === 'week' ? 'Week Schedule' :
    state.view === 'timeline' ? 'Field by Field' : 'Daily Schedule';
}

function renderChips() {
  const wrap = $('#chip-row-wrap');
  const row = clear($('#chip-row'));
  const { locations, eventTypes } = state.boot;
  const active = [];

  if (state.filters.location) {
    const loc = locations.find((l) => String(l.id) === state.filters.location);
    if (loc) active.push({ key: 'location', text: loc.name });
  }
  if (state.filters.field) {
    const field = locations.flatMap((l) => l.fields).find((f) => String(f.id) === state.filters.field);
    if (field) active.push({ key: 'field', text: field.name });
  }
  if (state.filters.type) active.push({ key: 'type', text: labelFor(eventTypes, state.filters.type) });
  if (state.filters.division) active.push({ key: 'division', text: state.filters.division });
  if (state.filters.q) active.push({ key: 'q', text: `"${state.filters.q}"` });

  const button = $('#btn-filters');
  if (button) {
    button.textContent = active.length ? `Filters (${active.length})` : 'Filters';
  }

  wrap.hidden = active.length === 0;
  if (!active.length) return;

  row.append(h('span', { class: 'lbl' }, 'Filtered by'));
  active.forEach((item) => {
    row.append(
      h('span', { class: 'chip' }, item.text,
        h('button', {
          type: 'button',
          'aria-label': `Remove ${item.text} filter`,
          onClick: () => {
            state.filters[item.key] = '';
            if (item.key === 'location') state.filters.field = '';
            $('#f-location').value = state.filters.location;
            $('#f-type').value = state.filters.type;
            $('#f-division').value = state.filters.division;
            $('#f-search').value = state.filters.q;
            rebuildFieldOptions();
            syncUrl();
            loadEvents();
          },
        }, '×'))
    );
  });
}

/* ---------------- Rendering ---------------- */

function render() {
  const root = clear($('#schedule-root'));
  const count = state.events.length;
  $('#result-count').textContent = count === 1 ? '1 event' : `${count} events`;

  if (!count) {
    root.append(emptyState());
    return;
  }
  if (state.view === 'timeline') {
    renderTimeline(root, {
      events: state.events,
      locations: state.boot.locations,
      date: state.anchor,
      today: state.today,
      labels: state.boot.eventTypes,
      onEventClick: showEvent,
    });
    root.append(timelineLegend());
  } else if (state.view === 'week') {
    root.append(renderWeek());
  } else {
    root.append(renderGroupedByDate());
  }
}

/** A small key to the block colours. */
function timelineLegend() {
  const shown = ['game', 'practice', 'cage', 'tournament'];
  return h('div', { class: 'tl-legend' },
    shown.map((type) => {
      const swatch = h('span', { class: `tl-swatch type-${type}` });
      return h('span', { class: 'tl-legend-item' },
        swatch, labelFor(state.boot.eventTypes, type));
    }),
    h('span', { class: 'tl-legend-item', style: 'margin-left:auto' },
      'Scroll sideways for later in the day'));
}

function emptyState() {
  const hasFilters = Object.values(state.filters).some(Boolean);
  return h('div', { class: 'empty' },
    h('div', { class: 'empty-icon', 'aria-hidden': 'true' }, '⚾'),
    h('h3', {}, 'Nothing scheduled'),
    h('p', {}, hasFilters
      ? 'No events match these filters. Try clearing them or looking at another date.'
      : state.view === 'day'
        ? 'No events are on the schedule for this day.'
        : 'No events are on the schedule for this range yet.'));
}

/** Day and Upcoming views: date headings, then a block per location. */
function renderGroupedByDate() {
  const frag = document.createDocumentFragment();
  const byDate = new Map();
  for (const event of state.events) {
    if (!byDate.has(event.date)) byDate.set(event.date, []);
    byDate.get(event.date).push(event);
  }

  for (const [date, events] of byDate) {
    const block = h('div', { class: 'day-block' });
    const heading = h('div', { class: `day-heading${date === state.today ? ' is-today' : ''}` },
      h('h3', {}, formatDateLong(date)),
      h('span', { class: 'day-count' }, events.length === 1 ? '1 event' : `${events.length} events`));
    block.append(heading);

    const byLocation = new Map();
    for (const event of events) {
      if (!byLocation.has(event.locationId)) byLocation.set(event.locationId, []);
      byLocation.get(event.locationId).push(event);
    }

    // Locations keep their configured order. Sorting by first start time would
    // float a site to the top just because it has an all-day block on it.
    const order = new Map(state.boot.locations.map((loc, i) => [loc.id, i]));
    const ordered = [...byLocation.entries()].sort(
      (a, b) => (order.get(a[0]) ?? 99) - (order.get(b[0]) ?? 99)
    );

    for (const [, locEvents] of ordered) {
      const first = locEvents[0];
      const group = h('div', { class: 'loc-group' },
        h('div', { class: 'loc-group-head' },
          h('span', { class: 'dot', 'aria-hidden': 'true' }),
          first.locationName),
        h('div', { class: 'event-list' }, locEvents.map(eventCard)));
      block.append(group);
    }
    frag.append(block);
  }
  return frag;
}

function eventCard(event) {
  const isOff = event.status !== 'scheduled';
  const headline = eventHeadline(event) || labelFor(state.boot.eventTypes, event.eventType);
  const meta = [];

  if (event.division) meta.push(h('span', {}, event.division));
  if (eventHeadline(event) && event.title && (event.homeTeam || event.awayTeam)) {
    meta.push(h('span', {}, [event.homeTeam, event.awayTeam].filter(Boolean).join(' vs ')));
  }
  meta.push(h('span', { class: `badge badge-${event.eventType}` },
    labelFor(state.boot.eventTypes, event.eventType)));

  return h('article', {
    class: `event type-${event.eventType}${isOff ? ' is-off' : ''}`,
    role: 'button',
    tabindex: '0',
    onClick: () => showEvent(event),
    onKeydown: (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showEvent(event); }
    },
  },
    h('div', { class: 'event-time' },
      event.allDay ? 'All day' : formatTime(event.startTime),
      event.allDay
        ? h('span', { class: 'to' }, 'field closed')
        : h('span', { class: 'to' }, `to ${formatTime(event.endTime)}`)),
    h('div', { class: 'event-main' },
      h('div', { class: 'event-title' }, headline),
      h('div', { class: 'event-meta' }, meta),
      event.notes ? h('div', { class: 'event-notes' }, event.notes) : null),
    h('div', { class: 'event-side' },
      isOff ? h('span', { class: `status-flag ${event.status}` },
        labelFor(state.boot.statuses, event.status)) : null,
      h('span', { class: 'event-field' }, `${event.locationName} · ${event.fieldName}`))
  );
}

function renderWeek() {
  const from = startOfWeek(state.anchor);
  const grid = h('div', { class: 'week-grid' });

  for (let i = 0; i < 7; i += 1) {
    const date = addDays(from, i);
    const dayEvents = state.events.filter((event) => event.date === date);
    const dateObj = parseDate(date);

    const col = h('div', { class: `week-col${date === state.today ? ' is-today' : ''}` },
      h('div', { class: 'week-col-head' },
        h('div', { class: 'week-col-dow' }, DOW_SHORT[dateObj.getDay()]),
        h('div', { class: 'week-col-date' }, `${MONTH_SHORT[dateObj.getMonth()]} ${dateObj.getDate()}`)),
      h('div', { class: 'week-col-body' },
        dayEvents.length
          ? dayEvents.map((event) =>
            h('button', {
              type: 'button',
              class: `mini-event type-${event.eventType}${event.status !== 'scheduled' ? ' is-off' : ''}`,
              onClick: () => showEvent(event),
            },
              h('div', { class: 'mini-time' }, event.allDay ? 'All day' : formatTime(event.startTime)),
              h('div', { class: 'mini-title' },
                eventHeadline(event) || labelFor(state.boot.eventTypes, event.eventType)),
              h('div', { class: 'mini-where' }, `${event.locationName} · ${event.fieldName}`)))
          : h('p', { class: 'inline-note', style: 'margin:4px 2px;font-size:12px' }, 'No events')));
    grid.append(col);
  }
  return grid;
}

/* ---------------- Event detail modal ---------------- */

function showEvent(event) {
  const modal = $('#event-modal');
  const location = state.boot.locations.find((loc) => loc.id === event.locationId);

  $('#event-modal-title').textContent =
    eventHeadline(event) || labelFor(state.boot.eventTypes, event.eventType);

  const rows = [
    ['When', `${formatDateLong(event.date)}\n${describeWhen(event)}`],
    ['Where', `${event.locationName} — ${event.fieldName}`],
    ['Type', labelFor(state.boot.eventTypes, event.eventType)],
  ];
  if (event.division) rows.push(['Division', event.division]);
  if (event.homeTeam || event.awayTeam) {
    rows.push(['Teams', [event.homeTeam, event.awayTeam].filter(Boolean).join(' vs ')]);
  }
  if (event.status !== 'scheduled') {
    rows.push(['Status', labelFor(state.boot.statuses, event.status)]);
  }
  if (event.locationAddress) rows.push(['Address', event.locationAddress]);
  if (event.notes) rows.push(['Notes', event.notes]);

  const list = h('dl', { class: 'detail-rows' });
  rows.forEach(([label, value]) => {
    const dd = h('dd', {});
    String(value).split('\n').forEach((line, i) => {
      if (i) dd.append(h('br'));
      dd.append(document.createTextNode(line));
    });
    list.append(h('div', { class: 'detail-row' }, h('dt', {}, label), dd));
  });

  const body = clear($('#event-modal-body'));
  body.append(list);

  if (location?.mapImage) {
    body.append(
      h('div', { style: 'margin-top:14px' },
        h('button', { class: 'btn btn-block', type: 'button',
          onClick: () => { closeModal(modal); showFieldMap(location); } },
          `View ${location.name} field map`))
    );
  }

  const directions = $('#event-modal-directions');
  if (location) {
    directions.href = directionsUrl(location);
    directions.hidden = false;
    directions.textContent = `Directions to ${location.name}`;
  } else {
    directions.hidden = true;
  }

  openModal(modal);
}

/* ---------------- Locations, directions and field maps ---------------- */

function renderLocations() {
  const grid = clear($('#loc-grid'));

  state.boot.locations.forEach((loc) => {
    const pills = h('div', { class: 'field-pills' },
      loc.fields.map((field) =>
        h('span', { class: `field-pill${field.kind === 'cage' ? ' is-cage' : field.kind === 'turf' ? ' is-turf' : field.kind === 'softball' ? ' is-softball' : ''}` },
          field.name)));

    const card = h('article', { class: 'loc-card' },
      h('div', { class: 'loc-card-head' },
        h('h3', {}, loc.name),
        loc.address ? h('div', { class: 'addr' }, loc.address) : null),
      h('div', { class: 'loc-card-body' },
        h('div', {},
          h('div', { class: 'lbl', style: 'margin-bottom:6px' },
            loc.fields.length === 1 ? '1 field' : `${loc.fields.length} fields`),
          pills),
        loc.notes ? h('p', { class: 'loc-note' }, loc.notes) : null,
        h('div', { class: 'loc-card-actions' },
          h('a', { class: 'btn btn-primary', href: directionsUrl(loc), target: '_blank', rel: 'noopener' },
            'Directions'),
          h('button', { class: 'btn', type: 'button', onClick: () => showFieldMap(loc) },
            'Field Map'))));

    grid.append(card);
  });
}

function showFieldMap(location) {
  const modal = $('#map-modal');
  $('#map-modal-title').textContent = `${location.name} — Field Map`;
  const body = clear($('#map-modal-body'));

  if (location.mapImage) {
    const stage = h('div', { class: 'map-stage' },
      h('img', { src: location.mapImage, alt: `Map of the fields at ${location.name}` }));

    location.pins.forEach((pin) => {
      const marker = h('div', { class: 'map-pin' },
        h('span', { class: 'map-pin-label' }, pin.label),
        h('span', { class: 'map-pin-stem' }),
        h('span', { class: 'map-pin-dot' }));
      marker.style.left = `${pin.x}%`;
      marker.style.top = `${pin.y}%`;
      if (pin.color) {
        marker.querySelector('.map-pin-label').style.background = pin.color;
        marker.querySelector('.map-pin-stem').style.background = pin.color;
        marker.querySelector('.map-pin-dot').style.background = pin.color;
      }
      stage.append(marker);
    });
    body.append(stage);

    if (location.pins.length) {
      body.append(h('p', { class: 'hint', style: 'margin-top:10px' },
        'Labels mark each field on the site.'));
    }
  } else {
    body.append(
      h('div', { class: 'map-empty' },
        h('div', { class: 'empty-icon', 'aria-hidden': 'true' }, '🗺'),
        h('h3', {}, 'No field map uploaded yet'),
        h('p', {}, `A league admin can add a labeled map of ${location.name} from the admin console.`),
        h('div', { class: 'field-pills', style: 'justify-content:center;margin-top:14px' },
          location.fields.map((f) => h('span', { class: 'field-pill' }, f.name))))
    );
  }

  const directions = $('#map-modal-directions');
  directions.href = directionsUrl(location);
  directions.textContent = `Directions to ${location.name}`;
  openModal(modal);
}

/* ---------------- Calendar subscription ---------------- */

function openSubscribe() {
  const modal = $('#subscribe-modal');

  const refresh = () => {
    const params = new URLSearchParams();
    const loc = $('#sub-location').value;
    const field = $('#sub-field').value;
    const division = $('#sub-division').value;
    if (loc) params.set('location', loc);
    if (field) params.set('field', field);
    if (division) params.set('division', division);
    const query = params.toString();
    const path = `/calendar.ics${query ? `?${query}` : ''}`;
    $('#sub-url').value = `${window.location.origin}${path}`;
    $('#btn-download-ics').href = path;
  };

  $('#sub-location').value = state.filters.location || '';
  $('#sub-division').value = state.filters.division || '';
  rebuildFieldOptions();
  $('#sub-field').value = state.filters.field || '';
  refresh();

  $('#sub-location').onchange = () => { rebuildFieldOptions(); refresh(); };
  $('#sub-field').onchange = refresh;
  $('#sub-division').onchange = refresh;

  $('#btn-copy-url').onclick = async () => {
    const input = $('#sub-url');
    try {
      await navigator.clipboard.writeText(input.value);
      toast('Subscription link copied.', 'success');
    } catch {
      input.select();
      toast('Press Ctrl/Cmd + C to copy the selected link.');
    }
  };

  openModal(modal);
}

function mountAdmin() {
/* Admin console. */
'use strict';

const admin = {
  me: null,
  boot: null,
  events: [],
  users: [],
  tab: 'schedule',
  filters: { from: '', to: '', location: '', field: '', type: '', q: '' },
  editing: null,     // event being edited, or null when adding
  mapEditor: null,   // { location, pins, selectedIndex }
  requestId: 0,      // guards against a slow earlier fetch landing last
  rainout: { date: '', events: [], selected: new Set(), loading: false, token: 0 },
  scheduleView: 'timeline',   // 'timeline' or 'list'
  timelineDate: '',       // the single day the timeline shows
};

/**
 * Which fields a rain-out should tick by default.
 *
 * The indoor cages are unaffected by weather, and turf drains long after grass
 * has given up, so neither is assumed out. Both can still be ticked by hand for
 * the snow day or the washout that takes everything.
 */
function rainDefault(kind) {
  return kind !== 'cage' && kind !== 'turf';
}

function rainReason(kind) {
  if (kind === 'cage') return { label: 'Indoor', className: 'indoor' };
  if (kind === 'turf') return { label: 'Drains well', className: 'drains' };
  return null;
}

/* ================================================================
   Boot
   ================================================================ */

async function init() {
  wireModals();

  try {
    const me = await api.get('/api/auth/me', { quiet: true });
    if (!me.signedIn) { window.location.href = '/admin/login'; return; }
    admin.me = me.user;
    api.csrfToken = me.csrfToken;
  } catch {
    window.location.href = '/admin/login';
    return;
  }

  $('#who').textContent = `${admin.me.displayName}${admin.me.role === 'owner' ? ' (owner)' : ''}`;

  await refreshBoot();

  const today = admin.boot.today;
  admin.filters.from = today;
  admin.filters.to = addDays(today, 30);
  $('#a-from').value = admin.filters.from;
  $('#a-to').value = admin.filters.to;

  admin.timelineDate = admin.boot.today;
  applyScheduleViewChrome();

  wireTabs();
  wireSchedule();
  wireBranding();
  wireAdmins();
  wireMisc();

  await loadEvents();
}

async function refreshBoot() {
  admin.boot = await api.get('/api/bootstrap');
  setBranding(admin.boot.settings);
  populateSelects();
}

function populateSelects() {
  const { locations, eventTypes, statuses, divisions, teams } = admin.boot;

  const select = $('#a-location');
  const keep = select.value;
  clear(select).append(h('option', { value: '' }, 'All locations'));
  locations.forEach((loc) => select.append(h('option', { value: String(loc.id) }, loc.name)));
  if (keep) select.value = keep;

  rebuildAdminFieldOptions();

  // Event editor: one flat list grouped by location so duplicate field
  // names (Majors, 60/90) can never be mixed up.
  const fieldSelect = $('#e-field');
  clear(fieldSelect).append(h('option', { value: '' }, 'Choose a field…'));
  locations.forEach((loc) => {
    const group = h('optgroup', { label: loc.name });
    loc.fields.forEach((field) =>
      group.append(h('option', { value: String(field.id) },

  [['#a-type', 'All types'], ['#e-type', null]].forEach(([sel, allLabel]) => {

function rebuildAdminFieldOptions() {
  const select = $('#a-field');
  const keep = select.value;
  clear(select).append(h('option', { value: '' }, 'All fields'));
  const pool = admin.filters.location
    ? admin.boot.locations.filter((loc) => String(loc.id) === admin.filters.location)
    : admin.boot.locations;

    const group = h('optgroup', { label: loc.name });

    if (loc.fields.length) select.append(group);
  });
  if (keep && select.querySelector(`option[value="${keep}"]`)) select.value = keep;
  else select.value = '';
}

/** Promise-based confirm dialog. */
function confirmAction({ title = 'Please Confirm', message, confirmLabel = 'Yes, Continue' }) {
  return new Promise((resolve) => {
    const modal = $('#confirm-modal');
    $('#confirm-modal-title').textContent = title;
    const body = clear($('#confirm-modal-body'));
    (Array.isArray(message) ? message : [message]).forEach((line) =>
      body.append(h('p', { style: 'margin:0 0 9px;font-size:14.5px' }, line)));

    const yes = $('#btn-confirm-yes');
    yes.textContent = confirmLabel;

    const cleanup = (result) => {
      yes.removeEventListener('click', onYes);
      modal.removeEventListener('close', onClose);
      resolve(result);
    };
    const onYes = () => { closeModal(modal); cleanup(true); };
    const onClose = () => cleanup(false);

    yes.addEventListener('click', onYes);
    modal.addEventListener('close', onClose, { once: true });
    openModal(modal);
  });
}

/* ---------------- Rain out a day ---------------- */

async function loadRainoutDay() {
  const date = $('#r-date').value;
  const picker = clear($('#rainout-picker'));
  admin.rainout.date = date;

  if (!date) {
    picker.append(h('p', { class: 'hint' }, 'Pick a date to see what is scheduled.'));
    updateRainoutCount();
    return;
  }

  picker.append(h('div', { class: 'skeleton' }, h('div', { class: 'skeleton-row' })));
  const token = ++admin.rainout.token;

  try {
    const data = await api.get(`/api/events?from=${date}&to=${date}`);
    if (token !== admin.rainout.token) return; // a newer date already answered
    admin.rainout.events = data.events;
    applyRainSelection('suggested');
  } catch (err) {
    if (token !== admin.rainout.token) return;
    clear($('#rainout-picker')).append(h('p', { class: 'form-error' }, err.message));
  }
}

/** Ticks a preset, then redraws. */
function applyRainSelection(mode) {
  const selected = new Set();
  for (const event of admin.rainout.events) {
    if (mode === 'all') selected.add(event.fieldId);
    else if (mode === 'suggested' && rainDefault(event.fieldKind)) selected.add(event.fieldId);
  }
  admin.rainout.selected = selected;
  renderRainoutPicker();
}

function renderRainoutPicker() {
  const picker = clear($('#rainout-picker'));
  const { events, selected } = admin.rainout;

  if (!events.length) {
    picker.append(
      h('div', { class: 'empty', style: 'padding:26px 16px' },
        h('h3', {}, 'Nothing scheduled that day'),
        h('p', {}, 'There is nothing to call off on this date.'))
    );
    updateRainoutCount();
    return;
  }

  // Count the day's events per field.
  const counts = new Map();
  for (const event of events) {
    counts.set(event.fieldId, (counts.get(event.fieldId) || 0) + 1);
  }

  // Walk the locations and fields in their configured order, so the list reads
  // the same way as everywhere else rather than in first-game-of-the-day order.
  const byLocation = admin.boot.locations
    .map((loc) => ({
      name: loc.name,
      fields: new Map(
        loc.fields
          .filter((f) => counts.has(f.id))
          .map((f) => [f.id, { name: f.name, kind: f.kind, count: counts.get(f.id) }])
      ),
    }))
    .filter((loc) => loc.fields.size);

  for (const loc of byLocation) {
    const fieldIds = [...loc.fields.keys()];
    const total = [...loc.fields.values()].reduce((sum, f) => sum + f.count, 0);
    const allOn = fieldIds.every((id) => selected.has(id));

    const block = h('div', { class: 'rain-loc' },
      h('div', { class: 'rain-loc-head' },
        loc.name,
        h('span', { class: 'rain-loc-count' }, total === 1 ? '1 event' : `${total} events`),
        h('span', { class: 'spacer' }),
        h('button', {
          class: 'btn btn-sm', type: 'button',
          onClick: () => {
            fieldIds.forEach((id) => (allOn ? selected.delete(id) : selected.add(id)));
            renderRainoutPicker();
          },
        }, allOn ? 'Clear site' : 'Whole site')));

    for (const [fieldId, field] of loc.fields) {
      const on = selected.has(fieldId);
      const why = rainReason(field.kind);
      block.append(
        h('label', { class: `rain-field${on ? '' : ' is-off'}` },
          h('input', {
            type: 'checkbox', checked: on,
            onChange: (e) => {
              if (e.target.checked) selected.add(fieldId);
              else selected.delete(fieldId);
              renderRainoutPicker();
            },
          }),
          h('span', { class: 'rain-name' }, field.name),
          h('span', { class: 'rain-count' }, field.count === 1 ? '1 event' : `${field.count} events`),
          h('span', { class: 'spacer' }),
          why ? h('span', { class: `rain-why ${why.className}` }, why.label) : null)
      );
    }
    picker.append(block);
  }

  updateRainoutCount();
}

function updateRainoutCount() {
  const { events, selected } = admin.rainout;
  const affected = events.filter((e) => selected.has(e.fieldId)).length;
  const status = labelFor(admin.boot.statuses, $('#r-status').value);

  $('#rainout-count').textContent = !events.length
    ? ''
    : affected === 0
      ? 'No fields ticked'
      : `${affected} of ${events.length} event(s) \u2192 ${status}`;

  $('#r-apply').disabled = affected === 0;
}

async function submitRainout(event) {
  event.preventDefault();
  const { date, selected, events } = admin.rainout;
  const status = $('#r-status').value;
  const fieldIds = [...selected];
  const affected = events.filter((e) => selected.has(e.fieldId));

  if (!affected.length) {
    toast('Tick at least one field.', 'error');
    return;
  }

  const spared = events.length - affected.length;
  const ok = await confirmAction({
    title: `Mark ${affected.length} event(s) as ${labelFor(admin.boot.statuses, status)}?`,
    message: [
      `On ${formatDateLong(date)}.`,
      spared
        ? `${spared} event(s) on the fields you left unticked carry on as scheduled.`
        : 'Every event that day is affected.',
      'You can change individual events back afterwards.',
    ],
    confirmLabel: 'Apply',
  });
  if (!ok) return;

  try {
    const result = await api.post('/api/admin/events/bulk-status', { date, status, fieldIds });
    closeModal($('#rainout-modal'));
    toast(`${result.updated} event(s) updated.`, 'success');
    loadEvents();
  } catch (err) {
    toast(err.message, 'error');
  }
}

async function loadEvents() {
  const params = new URLSearchParams();
  const timeline = admin.scheduleView === 'timeline';

  if (timeline) {
    const date = admin.timelineDate || admin.boot.today;
    admin.timelineDate = date;
    params.set('from', date);
    params.set('to', date);
  } else {
    if (admin.filters.from) params.set('from', admin.filters.from);
    if (admin.filters.to) params.set('to', admin.filters.to);
  }
  if (admin.filters.location) params.set('location', admin.filters.location);
  if (admin.filters.field) params.set('field', admin.filters.field);
  if (admin.filters.type) params.set('type', admin.filters.type);
  if (admin.filters.q) params.set('q', admin.filters.q);

  const root = $('#admin-schedule-root');
  root.replaceChildren(h('div', { class: 'skeleton' },
    h('div', { class: 'skeleton-row' }), h('div', { class: 'skeleton-row' })));

  const requestId = ++admin.requestId;

  try {
    const data = await api.get(`/api/events?${params}`);
    if (requestId !== admin.requestId) return; // a newer request already answered
    admin.events = data.events;
    renderStats();
    renderAdminSchedule();
  } catch (err) {
    if (requestId !== admin.requestId) return;
    root.replaceChildren(h('div', { class: 'empty' }, h('h3', {}, 'Could not load events'), h('p', {}, err.message)));

/* ---------------- Event editor ---------------- */

const MAX_OCCURRENCES = 60;

/** The dates a repeat would actually produce, given what is on the form. */
function repeatDates() {
  const start = $('#e-date').value;
  const every = Number($('#e-repeat-every').value) || 7;
  if (!start) return { dates: [], error: null };

  if ($('#e-end-until').checked) {
    const until = $('#e-repeat-until').value;
    if (!until) return { dates: [], error: 'Pick a date to repeat until.' };
    if (until < start) return { dates: [], error: 'That end date is before the event itself.' };
    const dates = [];
    for (let d = start; d <= until; d = addDays(d, every)) {
      dates.push(d);
      if (dates.length > MAX_OCCURRENCES) {
        return { dates: [], error: `That is more than ${MAX_OCCURRENCES} events. Choose an earlier end date.` };
      }
    }
    return { dates, error: null };
  }

  const count = Number($('#e-repeat-count').value);
  if (!Number.isInteger(count) || count < 1) return { dates: [], error: 'Enter how many times it repeats.' };
  if (count > MAX_OCCURRENCES) return { dates: [], error: `At most ${MAX_OCCURRENCES} at a time.` };
  const dates = [];
  for (let i = 0; i < count; i += 1) dates.push(addDays(start, i * every));
  return { dates, error: null };
}

/** Says in plain words what the Save button is about to create. */
function updateRepeatSummary() {
  const box = $('#repeat-summary');
  if (!$('#e-repeat').checked) { box.textContent = ''; return; }

  const { dates, error } = repeatDates();
  box.classList.toggle('is-warning', !!error);

  if (error) { box.textContent = error; return; }
  if (!dates.length) { box.textContent = ''; return; }
  if (dates.length === 1) {
    box.textContent = `Creates 1 event on ${formatDateMedium(dates[0])}.`;
    return;
  }

  const every = Number($('#e-repeat-every').value) || 7;
  const cadence = every === 1
    ? 'every day'
    : every === 7
      ? `every ${DOW_LONG[parseDate(dates[0]).getDay()]}`
      : `every other ${DOW_LONG[parseDate(dates[0]).getDay()]}`;

  box.textContent = `Creates ${dates.length} events, ${cadence} from `
    + `${formatDateMedium(dates[0])} through ${formatDateMedium(dates[dates.length - 1])}.`;
}

function openEventEditor(event, defaults = {}) {
  admin.editing = event;
  clear($('#event-form-error'));
  clear($('#conflict-slot'));

  const source = event || {};

  $('#event-editor-title').textContent = event ? 'Edit Event' : 'Add Event';
  $('#btn-delete-event').hidden = !event;
  $('#repeat-box').hidden = !!event;
  $('#e-repeat').checked = false;
  $('#repeat-options').hidden = true;

  const allDay = !!source.allDay;
  $('#e-all-day').checked = allDay;
  $('#field-start').hidden = allDay;
  $('#field-end').hidden = allDay;
  $('#field-through').hidden = !allDay;
  $('#e-start').required = !allDay;
  $('#e-end').required = !allDay;
  $('#e-through').value = '';
  $('#repeat-box').hidden = allDay || !!event;
  $('#e-repeat-count').value = '8';
  $('#e-repeat-every').value = '7';
  $('#e-end-count').checked = true;
  $('#e-repeat-until').value = '';
  clear($('#repeat-summary'));

async function saveEvent(submitEvent) {
  submitEvent.preventDefault();
  const errorSlot = clear($('#event-form-error'));
  clear($('#conflict-slot'));

  const payload = readEventForm();
  if (!payload.fieldId) {
    errorSlot.append(h('div', { class: 'form-error' }, 'Choose a location and field.'));
    return;
  }

  // "Through" a later date is a block on each of those days.
  if (!admin.editing && $('#e-all-day').checked && $('#e-through').value) {
    const through = $('#e-through').value;
    if (through < payload.eventDate) {
      errorSlot.append(h('div', { class: 'form-error' }, 'The "through" date is before the start date.'));
      return;
    }
    payload.repeat = true;
    payload.repeatEveryDays = 1;
    payload.repeatUntil = through;
  }

  if (!admin.editing && $('#e-repeat').checked) {
    const { error } = repeatDates();
    if (error) {
      errorSlot.append(h('div', { class: 'form-error' }, error));
      return;
    }
    payload.repeat = true;
    payload.repeatEveryDays = Number($('#e-repeat-every').value) || 7;
    if ($('#e-end-until').checked) payload.repeatUntil = $('#e-repeat-until').value;
    else payload.repeatCount = Number($('#e-repeat-count').value) || 1;
  }

  const button = $('#btn-save-event');
  button.disabled = true;
  button.textContent = 'Saving…';

  const send = (allowConflict) =>
    admin.editing
      ? api.put(`/api/admin/events/${admin.editing.id}`, { ...payload, allowConflict })
      : api.post('/api/admin/events', { ...payload, allowConflict });

  try {
    const result = await send(false);
    finishSave(result);
  } catch (err) {
    if (err.status === 409 && err.conflicts?.length) {
      // Let the form go back to rest while the dialog is up, so the button
      // behind it is not stuck reading "Saving...".
      button.disabled = false;
      button.textContent = 'Save Event';

      const attempted = {
        allDay: payload.allDay,
        startTime: payload.startTime,
        endTime: payload.endTime,
      };
      const choice = await showConflicts(err.conflicts, attempted);

      if (choice.action === 'anyway') {
        try {
          finishSave(await send(true));
          return;
        } catch (err2) {
          errorSlot.append(h('div', { class: 'form-error' }, err2.message));
        }
      } else if (choice.action === 'edit') {
        // Swap this editor for the booking that is in the way.
        const existing = admin.events.find((e) => e.id === choice.eventId)
          || (await api.get(`/api/events?from=${payload.eventDate}&to=${payload.eventDate}`))
            .events.find((e) => e.id === choice.eventId);
        closeModal($('#event-editor'));
        if (existing) {
          setTimeout(() => openEventEditor(existing), 120);
        } else {
          toast('That booking could not be opened. Find it in the list below.', 'error');
        }
      } else {
        // Back to the form, with the start time selected to retype.
        setTimeout(() => $('#e-start').focus(), 60);
      }
    } else {
      errorSlot.append(h('div', { class: 'form-error' }, err.message));
    }
  } finally {
    button.disabled = false;
    button.textContent = 'Save Event';
  }
}

function finishSave(result) {
  closeModal($('#event-editor'));
  if (result.skipped?.length) {
    toast(`Saved. ${result.skipped.length} date(s) were skipped because the field was booked.`, 'success', 6000);
  } else if (result.events) {
    toast(`${result.events.length} event(s) added.`, 'success');
  } else {
    toast('Event saved.', 'success');
  }
  refreshBoot().then(loadEvents);
}

/**
 * Stops the save and shows what is in the way.
 *
 * Resolves to 'anyway' to allow the overlap, 'edit' when the admin chose to go
 * and move the existing booking instead, or 'cancel' to go back to the form.
 */
function showConflicts(conflicts, attempted) {
  return new Promise((resolve) => {
    const modal = $('#conflict-modal');
    const only = conflicts.length === 1;

    $('#conflict-modal-title').textContent = only
      ? 'That field is already booked'
      : 'That field has other bookings';

    $('#conflict-intro').textContent = only
      ? `${conflicts[0].locationName} · ${conflicts[0].fieldName} already has something on `
        + `${formatDateMedium(conflicts[0].date)}:`
      : `${conflicts[0].locationName} · ${conflicts[0].fieldName} already has `
        + `${conflicts.length} bookings that overlap:`;

    const list = clear($('#conflict-list'));

    conflicts.forEach((clash) => {
      list.append(
        h('div', { class: 'clash' },
          h('div', { class: 'clash-main' },
            h('div', { class: 'clash-when' },
              clash.allDay ? 'All day' : formatTimeRange(clash.startTime, clash.endTime)),
            h('div', { class: 'clash-what' }, clash.label || 'Booked')),
          h('button', {
            class: 'btn btn-sm', type: 'button',
            onClick: () => settle('edit', clash.id),
          }, 'Open this one'))
      );
    });

    // Spell out what was being added, so the overlap is obvious.
    if (attempted) {
      list.append(
        h('div', { class: 'clash-yours' },
          h('div', { class: 'clash-when' },
            attempted.allDay ? 'All day' : formatTimeRange(attempted.startTime, attempted.endTime)),
          h('div', { class: 'clash-what' }, 'what you are adding'))
      );
    }

    let settled = false;
    const settle = (result, id) => {
      if (settled) return;
      settled = true;
      closeModal(modal);
      resolve({ action: result, eventId: id });
    };

    $('#btn-conflict-anyway').onclick = () => settle('anyway');
    $$('[data-conflict-cancel]', modal).forEach((btn) => { btn.onclick = () => settle('cancel'); });
    modal.addEventListener('close', () => settle('cancel'), { once: true });

    openModal(modal);
  });
}

function pickImage() {
  return new Promise((resolve) => {
    const input = h('input', { type: 'file', accept: 'image/png,image/jpeg,image/webp,image/gif,image/svg+xml' });
    input.style.display = 'none';
    document.body.append(input);
    input.addEventListener('change', () => {
      const file = input.files?.[0] || null;
      input.remove();
      resolve(file);
    });
    input.addEventListener('cancel', () => { input.remove(); resolve(null); });
    input.click();
  });
}

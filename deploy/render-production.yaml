# Render.com blueprint — PRODUCTION (paid).
#
# Use this once the league is relying on the site. The "starter" plan is paid
# (about $7/month at the time of writing) and is what makes the persistent disk
# possible; the disk is what keeps the schedule across restarts and deploys.
#
# To use it, copy this file over render.yaml in the repository root and push,
# then upgrade the service's plan in the Render dashboard.
services:
  - type: web
    name: jhll-field-scheduler
    runtime: node
    plan: starter
    buildCommand: npm install
    # Seeding runs at start, not at build: the persistent disk is only mounted
    # at runtime, so a build-time seed would write to a throwaway filesystem.
    # The seed is insert-only, so repeating it never overwrites your edits.
    startCommand: npm run seed && npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: SESSION_SECRET
        generateValue: true
      - key: TRUST_PROXY_HOPS
        value: "1"
    disk:
      name: jhll-data
      mountPath: /data
      sizeGB: 1

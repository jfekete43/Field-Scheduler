# Render.com blueprint.
#
# Create the service from this file, then set SESSION_SECRET in the Render
# dashboard. The persistent disk is what keeps the schedule across deploys —
# without it every deploy starts from an empty database.
services:
  - type: web
    name: jhll-field-scheduler
    runtime: node
    plan: starter
    buildCommand: npm install
    # Seeding runs at start, not at build: the persistent disk is only mounted
    # at runtime, so a build-time seed would write to a throwaway filesystem.
    # The seed is insert-only, so repeating it never overwrites your edits.
    startCommand: npm run seed && npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: SESSION_SECRET
        generateValue: true
      - key: TRUST_PROXY_HOPS
        value: "1"
    disk:
      name: jhll-data
      mountPath: /data
      sizeGB: 1
